org.gradle.jvmargs=-Xmx1536m
org.gradle.caching=true
android.nonTransitiveRClass=true
# Needed by the Shizuku provider library (it uses androidx.annotation / core).
android.useAndroidX=true
# The first two parts of the app's version. The last part is the GitHub run number, so a build is always newer
# than the one before: version 0.2.45 is released as tag v0.2.45. Raise this for a bigger step (0.3, 1.0).
versionBase=0.2
