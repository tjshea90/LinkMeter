plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tj.linkmeter'
    compileSdk 34

    // Every GitHub build gets a higher version code, so the tablet can tell the phone's copy is older.
    def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

    defaultConfig {
        applicationId 'com.tj.linkmeter'
        minSdk 29          // tablet is Android 10 (API 29); phone is Android 16
        targetSdk 34       // stays below 35 so no forced edge-to-edge layout
        versionCode runNumber
        versionName "0.2.${runNumber}"
    }

    // A fixed key kept in the repo so every build is signed the same way and
    // installs as an update over the previous one. Sideload use only.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // R8 shrinks the code; there are no libraries, so the APK stays tiny.
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The only libraries: Shizuku lets the phone run privileged shell commands.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
