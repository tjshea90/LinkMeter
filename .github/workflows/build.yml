name: build-apk

# Every push to main builds the APK and publishes it as the "latest" release,
# so it can be downloaded straight onto the phone or the tablet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already has the Android SDK. This only accepts its licences.
      # (packages: '' skips the "tools" package, which no longer exists and
      # made the default install fail.)
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk LinkMeter.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LinkMeter.apk \
            --target "$GITHUB_SHA" \
            --title "LinkMeter (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Install the same APK on the phone and the tablet."

      - uses: actions/upload-artifact@v4
        with:
          name: LinkMeter-apk
          path: LinkMeter.apk
